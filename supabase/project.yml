# Альтернативный способ получить Xcode-проект: XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Основной проект Anivibe.xcodeproj уже лежит в репозитории; этот файл — запасной вариант,
# если проект нужно пересоздать:  brew install xcodegen && xcodegen generate
name: Anivibe
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
packages:
  AnivibeCore:
    path: Packages/AnivibeCore
targets:
  Anivibe:
    type: application
    platform: iOS
    sources:
      - path: Anivibe
    configFiles:
      Debug: Config/Anivibe.xcconfig
      Release: Config/Anivibe.xcconfig
    dependencies:
      - package: AnivibeCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Anivibe
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  Anivibe:
    build:
      targets:
        Anivibe: all
    test:
      targets:
        - package: AnivibeCore/AnivibeCoreTests

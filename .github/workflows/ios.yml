# Tests, Debug simulator compilation, Release device compilation, unsigned IPA.
# A green workflow verifies compilation, not real-device UI/auth/video behavior.
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: AnivibeCore tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show runner toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Static project checks
        run: python3 scripts/check_project.py
      - name: Test build configuration scripts
        run: python3 scripts/test_build_scripts.py
      - name: Run AnivibeCore tests
        shell: bash
        run: |
          set -o pipefail
          cd Packages/AnivibeCore
          swift test 2>&1 | tee ../../swift-test.log
      - name: Save test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: swift-test.log
          if-no-files-found: warn
          retention-days: 7

  database:
    name: PostgreSQL migrations and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-test-only
      PGTEST_DB: anivibe_social_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Test migrations, RLS and concurrent friend actions
        shell: bash
        run: |
          set -o pipefail
          python3 supabase/tests/social_test.py 2>&1 | tee social-database-tests.log
      - name: Save database test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-database-test-log
          path: social-database-tests.log
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: [test, database]
    name: Compile iOS and package IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show runner toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Prepare optional CI overrides
        env:
          ANIVIBE_SUPABASE_URL: ${{ secrets.ANIVIBE_SUPABASE_URL }}
          ANIVIBE_SUPABASE_ANON_KEY: ${{ secrets.ANIVIBE_SUPABASE_ANON_KEY }}
          ANIVIBE_KODIK_TOKEN: ${{ secrets.ANIVIBE_KODIK_TOKEN }}
          ANIVIBE_MANIFEST_URL: ${{ secrets.ANIVIBE_MANIFEST_URL }}
        run: python3 scripts/write_ci_config.py
      - name: Compile Debug for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project Anivibe.xcodeproj \
            -scheme Anivibe \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee simulator-build.log
      - name: Compile Release for iPhone
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project Anivibe.xcodeproj \
            -scheme Anivibe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Anivibe.app"
          test -f "$APP/Info.plist"
          test -f "$APP/Anivibe"
          rm -rf Payload Anivibe.ipa
          mkdir Payload
          ditto "$APP" "Payload/Anivibe.app"
          ditto -c -k --norsrc --keepParent Payload Anivibe.ipa
          unzip -t Anivibe.ipa
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('Anivibe.ipa') as archive:
              names = set(archive.namelist())
              for required in ['Payload/Anivibe.app/Info.plist', 'Payload/Anivibe.app/Anivibe']:
                  if required not in names:
                      raise SystemExit('Incomplete IPA: ' + required)
          print('IPA structure verified')
          PY
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Anivibe-unsigned-ipa-r${{ github.run_number }}
          path: Anivibe.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            simulator-build.log
            xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
